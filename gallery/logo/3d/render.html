<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clayducation 3D logo</title>
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
// The Clayducation logo in 3D clay: "clayducati_n" as thick, rounded clay letters, and a clay pebble with a
// play button pressed into it for the "o". ?v=clay | ink | pop picks the colours; ?mark=1 draws the pebble alone.
import * as THREE from '../../world/three.module.min.js';
import { studio } from '../../world/clay/mascot.js';
const q = new URLSearchParams(location.search), V = q.get('v') || 'ink', MARK = q.has('mark');
const W = innerWidth, H = innerHeight;
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H); R.setClearColor(0x000000, 0);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.NoToneMapping;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(R.domElement);
const scene = new THREE.Scene(); studio(THREE, R, scene); scene.environmentIntensity = 0.75;
const G = await (await fetch('glyphs.json')).json();

// Noise, for the hand-made wobble of the clay and its fine texture.
const hash = (x, y, z) => { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); };
const noise = (x, y, z) => {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi, s = (t) => t * t * (3 - 2 * t), u = s(xf), v = s(yf), w = s(zf), c = (a, b, d) => hash(xi + a, yi + b, zi + d), L = (a, b, t) => a + (b - a) * t;
  return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v), L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w) * 2 - 1;
};
const bump = (() => {
  const N = 512, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d'), img = g.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const v = 0.5 + 0.28 * noise(x / 22, y / 22, 1) + 0.14 * noise(x / 7, y / 7, 5) + 0.06 * (hash(x, y, 3) - 0.5);
    const o = (y * N + x) * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = Math.max(0, Math.min(255, v * 255)); img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); return t;
})();
const clay = (color, vc = false) => new THREE.MeshPhysicalMaterial({ color, vertexColors: vc, roughness: 0.6, sheen: 0.35, sheenRoughness: 0.55, sheenColor: new THREE.Color('#fff1e6'), specularIntensity: 0.25, bumpMap: bump, bumpScale: 0.6 });
const wobble = (geo, k, seed) => {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), n = k * noise(x * 6 + seed, y * 6, z * 6); p.setXYZ(i, x + n, y + n * 0.7, z + n * 0.6); }
  geo.computeVertexNormals();
};

// The pebble with the pressed-in play button (centre at the origin, radius r).
function pebble(r, color, seed = 3) {
  const geo = new THREE.SphereGeometry(r, 160, 120), p = geo.attributes.position, v = new THREE.Vector3(), col = new Float32Array(p.count * 3).fill(1);
  // The play triangle (in units of r), pointing right, with round corners.
  const A = [[-0.36, 0.42], [-0.36, -0.42], [0.42, 0]], tri = (x, y) => {
    let d = -1e9;
    for (let i = 0; i < 3; i++) { const [ax, ay] = A[i], [bx, by] = A[(i + 1) % 3], ex = bx - ax, ey = by - ay, l = Math.hypot(ex, ey), nx = ey / l, ny = -ex / l; d = Math.max(d, (x - ax) * nx + (y - ay) * ny); }
    return d - 0.06;   // < 0 inside; rounded by the offset
  };
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    let x = v.x, y = v.y, z = v.z * 0.62;
    const s = 1 + 0.04 * noise(v.x / r * 2 + seed, v.y / r * 2, v.z / r * 2);   // uneven, as pressed by hand
    x *= s * 1.03; y *= s * 0.97; z *= s;
    if (v.z > 0) { const d = tri(v.x / r, v.y / r), k = Math.min(1, Math.max(0, -d / 0.08)), e = k * k * (3 - 2 * k) * Math.min(1, v.z / r * 2); z -= r * 0.24 * e; col.fill(1 - 0.32 * e, i * 3, i * 3 + 3); }   // the hollow is deeper and darker
    p.setXYZ(i, x, y, z);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, clay(color, true)); m.castShadow = true; return m;
}

// A letter: its outline, pushed out into a thick clay piece with rounded edges.
function letter(g, color, i) {
  const sp = new THREE.ShapePath();
  for (const c of g.path) {
    if (c[0] === 'M') sp.moveTo(c[1], c[2]); else if (c[0] === 'L') sp.lineTo(c[1], c[2]);
    else if (c[0] === 'Q') sp.quadraticCurveTo(c[1], c[2], c[3], c[4]); else if (c[0] === 'C') sp.bezierCurveTo(c[1], c[2], c[3], c[4], c[5], c[6]);
  }
  const geo = new THREE.ExtrudeGeometry(sp.toShapes(), { depth: 0.12, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.05, bevelSegments: 12, curveSegments: 28 });
  geo.translate(0, 0, -0.08);
  wobble(geo, 0.011, i * 7.3);
  const m = new THREE.Mesh(geo, clay(color)); m.castShadow = true;
  // A little out of line, as if set by hand.
  m.rotation.z = (hash(i, 1, 2) - 0.5) * 0.07; m.position.y = (hash(i, 3, 4) - 0.5) * 0.03; m.rotation.y = (hash(i, 5, 6) - 0.5) * 0.12;
  return m;
}

const POP = ['#ff5a4e', '#ffb627', '#22c3a6', '#4f7cff', '#ff6fb1'];
const COL = { clay: () => '#c98058', ink: () => '#2c2b31', pop: (i) => POP[i % POP.length] };
const group = new THREE.Group(); scene.add(group);
const PEB = '#cd8358';
let span;
if (MARK) { const m = pebble(0.5, PEB); m.rotation.set(0.12, -0.25, 0); group.add(m); span = [-0.55, 0.55]; }
else {
  let k = 0;
  for (const g of G.glyphs) {
    if (g.ch === 'o') {
      // The o: the pebble, a little larger than the x-height, on the baseline, as round as the letters.
      const r = G.xh * 0.6, m = pebble(r, PEB); m.position.set(g.x + g.adv / 2, G.xh * 0.5, 0.02); m.rotation.set(0.05, -0.12, 0.04); group.add(m); continue;
    }
    if (g.ch === 'i') {
      // The i: its stem, and a ball of coral clay for its dot, with a clear gap (as one piece, it reads as an l).
      const parts = []; let cur = []; for (const c of g.path) { cur.push(c); if (c[0] === 'Z') { parts.push(cur); cur = []; } }
      const top = (cs) => Math.min(...cs.filter((c) => c.length > 1).map((c) => c[c.length - 1]));
      const stem = parts.filter((cs) => top(cs) < G.xh * 0.9), dot = parts.filter((cs) => top(cs) >= G.xh * 0.9).flat();
      const m = letter({ ...g, path: stem.flat() }, COL[V](k++), k); m.position.x += g.x; group.add(m);
      const xs = dot.filter((c) => c.length > 1).map((c) => c[c.length - 2]), cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.105, 64, 48), clay(V === 'pop' ? '#ff5a4e' : '#ff5a4e')); ball.castShadow = true;
      wobble(ball.geometry, 0.006, 9.1); ball.position.set(g.x + cx, G.xh + 0.2, 0.02); group.add(ball);
      continue;
    }
    const m = letter(g, COL[V](k++), k); m.position.x += g.x; group.add(m);
  }
  span = [0, G.width];
}
const mid = (span[0] + span[1]) / 2; group.position.x = -mid;

// The floor: it only catches the shadow, so the picture is clear round the logo.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(MARK ? 4 : 12, MARK ? 4 : 5), new THREE.ShadowMaterial({ opacity: 0.3 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = MARK ? -0.33 : -0.215; floor.receiveShadow = true; scene.add(floor);
if (!MARK) group.position.y = 0; else group.position.y = 0;
const sun = new THREE.DirectionalLight('#fff3e6', 1.5); sun.position.set(-3, 6, 5); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 6; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.01;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 3, bottom: -3, near: 0.5, far: 20 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

// The camera: a little from above and from the left.
const cam = new THREE.PerspectiveCamera(MARK ? 26 : 18, W / H, 0.1, 100);
// Aim at the middle of what is drawn, and step back until it fills most of the picture.
const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
const dir = MARK ? new THREE.Vector3(-0.15, 0.28, 1).normalize() : new THREE.Vector3(-0.1, 0.17, 1).normalize();
const fill = MARK ? 0.78 : 0.86, fh = 2 * Math.tan(cam.fov * Math.PI / 360), dist = Math.max(sz.y / (fh * fill), sz.x / (fh * cam.aspect * fill)) + sz.z;
cam.position.copy(c).addScaledVector(dir, dist); cam.lookAt(c); cam.updateMatrixWorld();
// Then centre it on the screen as drawn (the view from above moves it off the middle).
let x0 = 1, x1 = -1, y0 = 1, y1 = -1;
for (const xx of [box.min.x, box.max.x]) for (const yy of [box.min.y, box.max.y]) for (const zz of [box.min.z, box.max.z]) { const v = new THREE.Vector3(xx, yy, zz).project(cam); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
cam.setViewOffset(W, H, (x0 + x1) / 2 * W / 2, -(y0 + y1) / 2 * H / 2, W, H);
// Draw on every frame (a capture of one single frame can miss a mesh).
const loop = () => { R.render(scene, cam); requestAnimationFrame(loop); }; loop();
document.documentElement.dataset.done = '1';
</script>
</body>
</html>
